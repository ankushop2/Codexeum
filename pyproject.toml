[project]
name = "codex-pet-battle"
version = "0.1.0"
description = "Codex pet battle FastAPI API"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "openai>=1.60,<3"]

[dependency-groups]
dev = ["ruff>=0.12", "pytest>=8,<10", "httpx>=0.27,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
